    </linearGradient>
    <linearGradient id="barG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3A3F4D"/>
      <stop offset="0.6" stop-color="#C9CEDB"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.38" cy="0.34" r="0.75">
