    <radialGradient id="sphere" cx="0.36" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#8E9AB0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#08090C" stop-opacity="0.55"/>
